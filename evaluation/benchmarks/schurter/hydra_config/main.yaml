eval_num_workers: 1
eval_output_dir: # To be filled in by the script
agent_cls: DataScienceBenchAgent
eval_note: temp
prompt_id: ""
instance: ""
class_type: "tickets"

trajectory_visualiser_folder: '/home/tommaso/home_tommaso/repos/OpenHands/trajectory-visualizer/public'
